{% extends 'base.html' %}

{% block title %}Page Not Found - AI Food Recipe System{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="p-5 bg-white rounded-4 border shadow-sm">
                <div class="display-1 fw-bold text-danger mb-2" style="color: var(--primary-color) !important;">
                    <i class="fa-solid fa-utensils"></i> 404
                </div>
                <h3 class="fw-bold mb-3">Recipe or Page Not Found</h3>
                <p class="text-muted mb-4">
                    The dish or page you are looking for seems to have slipped off the chef's counter!
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-danger rounded-pill px-4 py-2 fw-semibold" style="background-color: var(--primary-color); border:none;">
                        <i class="fa-solid fa-house me-1"></i> Back to Home
                    </a>
                    <button class="btn btn-outline-dark rounded-pill px-4 py-2 fw-semibold" data-bs-toggle="modal" data-bs-target="#quickSearchModal">
                        <i class="fa-solid fa-magnifying-glass me-1"></i> Search Recipe
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
