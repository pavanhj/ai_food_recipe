{% extends 'base.html' %}

{% block title %}Sign In - AI Food Recipe System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-white border-0 text-center pt-4 pb-2">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Recipe.AI" height="46" class="mb-2">
                    <h4 class="fw-bold text-dark mt-2">Welcome Back</h4>
                    <p class="text-muted small mb-0">Sign in to manage your favourite recipes & history</p>
                </div>
                
                <div class="card-body p-4 pt-2">
                    <form action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-muted">EMAIL ADDRESS</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 py-2.5" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label small fw-semibold text-muted">PASSWORD</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 py-2.5" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mb-3 mt-4">
                            <button type="submit" class="btn btn-danger py-2.5 fw-bold rounded-3" style="background-color: var(--primary-color); border:none;">
                                <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In to Account
                            </button>
                        </div>

                        <!-- One-Click Demo Credentials for Project Viva / Presentation -->
                        <div class="p-3 bg-light rounded-3 border text-center mb-3">
                            <div class="small fw-semibold text-dark mb-1">
                                <i class="fa-solid fa-graduation-cap text-primary me-1"></i> BCA Viva Demo Account
                            </div>
                            <div class="text-muted small mb-2">
                                <code>demo@recipeai.com</code> &bull; <code>password123</code>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1" id="btnFillDemo">
                                <i class="fa-solid fa-key me-1"></i> Autofill Demo Credentials
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-light border-0 text-center py-3">
                    <p class="small text-muted mb-0">
                        Don't have an account yet? 
                        <a href="{{ url_for('register') }}" class="fw-bold text-danger text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
