{% extends 'base.html' %}

{% block title %}Create Account - AI Food Recipe System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-white border-0 text-center pt-4 pb-2">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Recipe.AI" height="46" class="mb-2">
                    <h4 class="fw-bold text-dark mt-2">Create New Account</h4>
                    <p class="text-muted small mb-0">Join our AI culinary platform and save your favourite recipes</p>
                </div>
                
                <div class="card-body p-4 pt-2">
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold text-muted">FULL NAME</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 py-2.5" id="name" name="name" value="{{ name or '' }}" placeholder="Chef Gordon Ramsay" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-muted">EMAIL ADDRESS</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 py-2.5" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold text-muted">PASSWORD (MIN 6 CHARS)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 py-2.5" id="password" name="password" placeholder="••••••••" minlength="6" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label small fw-semibold text-muted">CONFIRM PASSWORD</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 py-2.5" id="confirm_password" name="confirm_password" placeholder="••••••••" minlength="6" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mb-3 mt-4">
                            <button type="submit" class="btn btn-danger py-2.5 fw-bold rounded-3" style="background-color: var(--primary-color); border:none;">
                                <i class="fa-solid fa-user-plus me-1"></i> Register Free Account
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-light border-0 text-center py-3">
                    <p class="small text-muted mb-0">
                        Already have an account? 
                        <a href="{{ url_for('login') }}" class="fw-bold text-danger text-decoration-none">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
